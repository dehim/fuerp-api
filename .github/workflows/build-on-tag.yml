name: Deploy Yii2 Backend on Tag

on:
  push:
    tags:
      - "*"

jobs:
  deploy:
    runs-on: self-hosted

    strategy:
      matrix:
        env:
          - name: prod
            base: /shareVolume/www/fuerp-api-prod
            yii_env: Production
            composer_flags: "--no-dev --prefer-dist --optimize-autoloader"
          - name: dev
            base: /shareVolume/www/fuerp-api-dev
            yii_env: Development
            composer_flags: "--prefer-dist"

    steps:
      # 1️⃣ 拉取代码
      - name: Checkout code
        uses: actions/checkout@v3

      # 2️⃣ 准备发布目录
      - name: Prepare release directory
        run: |
          set -e

          echo "当前全局变量："
          printenv
          TS=$(date +%Y%m%d_%H%M%S)
          BASE=${{ matrix.env.base }}
          RELEASES=${BASE}/releases
          NEW_RELEASE=${RELEASES}/${TS}

          mkdir -p "${NEW_RELEASE}"
          rsync -a --delete ./ "${NEW_RELEASE}/"

          echo "NEW_RELEASE=${NEW_RELEASE}" >> $GITHUB_ENV
          echo "BASE=${BASE}" >> $GITHUB_ENV

      # 3️⃣ Composer install
      - name: Composer install
        run: |
          set -e
          cd "${NEW_RELEASE}"

          composer install \
            ${{ matrix.env.composer_flags }} \
            --no-interaction

      # 4️⃣ Yii2 init（关键）
      - name: Yii2 init
        run: |
          set -e
          cd "${NEW_RELEASE}"

          php init --env=${{ matrix.env.yii_env }} --overwrite=n

      # 5️⃣ Yii2 prepare
      - name: Yii2 prepare
        run: |
          set -e
          cd "${NEW_RELEASE}"

          if [ -f yii ]; then
            php yii cache/flush-all || true
            php yii migrate --interactive=0 || true
          fi

      # 6️⃣ 原子切换（修正版）
      - name: Atomic deploy
        run: |
          set -e

          CURRENT=${BASE}/current
          PREV=${BASE}/previous

          # 如果 current 是软链接，先处理 previous
          if [ -L "${CURRENT}" ]; then
            # 如果 previous 已存在（不管是文件、目录、软链），先删掉
            if [ -e "${PREV}" ] || [ -L "${PREV}" ]; then
              rm -rf "${PREV}"
            fi

            # 把 current 指向的真实目录挪到 previous
            mv "$(readlink ${CURRENT})" "${PREV}"
          fi

          # current 原子切换
          ln -sfn "${NEW_RELEASE}" "${CURRENT}"

      # 7️⃣ Supervisor 重启相关进程
      - name: Restart Supervisor processes
        run: |
          set -e

          supervisorctl_safe_exec() {
              local process_name="$1"

              STATUS=$(sudo supervisorctl status "$process_name" 2>&1 || true)

              if echo "$STATUS" | grep -q "no such process"; then
                  echo "进程 $process_name 不存在，跳过"
                  return 0
              fi

              if echo "$STATUS" | grep -q "RUNNING"; then
                  echo "进程 $process_name 正在运行，执行 restart"
                  sudo supervisorctl restart "$process_name" || true
                  return 0
              fi

              if echo "$STATUS" | grep -Eq "FATAL|STOPPED|EXITED|BACKOFF"; then
                  echo "进程 $process_name 当前状态异常，执行 start"
                  sudo supervisorctl start "$process_name" || true
                  return 0
              fi

              echo "进程 $process_name 状态未知："
              echo "$STATUS"
              return 0
          }

          supervisorctl_safe_exec "fuerp-api-${{ matrix.env.name }}-task-worker"

      # 8️⃣ 清理旧版本（保留 3 份）
      - name: Cleanup old releases
        run: |
          set -e
          cd "${BASE}/releases"
          ls -dt */ | tail -n +4 | xargs -r rm -rf

# # 旧版回滚命令示例：
# cd /shareVolume/www/fuerp-api-prod
# rm current
# ln -s previous current
