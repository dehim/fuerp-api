name: Deploy Yii2 Backend on Tag

on:
  push:
    tags:
      - "*"

jobs:
  deploy:
    runs-on: self-hosted

    strategy:
      matrix:
        env:
          - name: prod
            base: /shareVolume/www/fuerp-api-prod
            yii_env: Production
            composer_flags: "--no-dev --prefer-dist --optimize-autoloader"
          - name: test
            base: /shareVolume/www/fuerp-api-dev
            yii_env: Development
            composer_flags: "--prefer-dist"

    steps:
      # 1️⃣ 拉取代码
      - name: Checkout code
        uses: actions/checkout@v3

      # 2️⃣ 准备发布目录
      - name: Prepare release directory
        run: |
          set -e

          TS=$(date +%Y%m%d_%H%M%S)
          BASE=${{ matrix.env.base }}
          RELEASES=${BASE}/releases
          NEW_RELEASE=${RELEASES}/${TS}

          mkdir -p "${NEW_RELEASE}"
          rsync -a --delete ./ "${NEW_RELEASE}/"

          echo "NEW_RELEASE=${NEW_RELEASE}" >> $GITHUB_ENV
          echo "BASE=${BASE}" >> $GITHUB_ENV

      # 3️⃣ Composer install
      - name: Composer install
        run: |
          set -e
          cd "${NEW_RELEASE}"

          composer install \
            ${{ matrix.env.composer_flags }} \
            --no-interaction

      # 4️⃣ Yii2 init（关键）
      - name: Yii2 init
        run: |
          set -e
          cd "${NEW_RELEASE}"

          php init --env=${{ matrix.env.yii_env }} --overwrite=n

      # 5️⃣ Yii2 prepare
      - name: Yii2 prepare
        run: |
          set -e
          cd "${NEW_RELEASE}"

          if [ -f yii ]; then
            php yii cache/flush-all || true
            php yii migrate --interactive=0 || true
          fi

      # 6️⃣ 原子切换
      - name: Atomic deploy
        run: |
          set -e

          CURRENT=${BASE}/current
          PREV=${BASE}/previous

          if [ -L "${CURRENT}" ]; then
            rm -f "${PREV}"
            mv "$(readlink ${CURRENT})" "${PREV}" || true
          fi

          ln -sfn "${NEW_RELEASE}" "${CURRENT}"

      # 7️⃣ 清理旧版本（保留 3 份）
      - name: Cleanup old releases
        run: |
          set -e
          cd "${BASE}/releases"
          ls -dt */ | tail -n +4 | xargs -r rm -rf
