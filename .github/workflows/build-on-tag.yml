name: Deploy Yii2 Backend on Tag

on:
  push:
    tags:
      - "*"

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      # 1️⃣ 拉取代码
      - name: Checkout code
        uses: actions/checkout@v3

      # 2️⃣ 准备发布目录
      - name: Prepare release directory
        run: |
          set -e

          TS=$(date +%Y%m%d_%H%M%S)
          BASE=/shareVolume/www/fuerp-api
          RELEASES=${BASE}/releases
          NEW_RELEASE=${RELEASES}/${TS}

          mkdir -p "${NEW_RELEASE}"
          rsync -a --delete ./ "${NEW_RELEASE}/"

          echo "NEW_RELEASE=${NEW_RELEASE}" >> $GITHUB_ENV
          echo "BASE=${BASE}" >> $GITHUB_ENV

      # 3️⃣ Composer install（如果存在 composer.json）
      - name: Composer install (if needed)
        run: |
          set -e
          cd "${NEW_RELEASE}"

          if [ -f composer.json ]; then
            echo "composer.json found, running composer install"
            composer install \
              --no-dev \
              --prefer-dist \
              --optimize-autoloader \
              --no-interaction
          else
            echo "composer.json not found, skip composer install"
          fi

      # 4️⃣ Yii2 初始化 & 常规优化（可选）
      - name: Yii2 prepare (if yii exists)
        run: |
          set -e
          cd "${NEW_RELEASE}"

          if [ -f yii ]; then
            echo "Yii detected, running yii optimizations"
            php yii cache/flush-all || true
            php yii migrate --interactive=0 || true
          else
            echo "yii not found, skip yii steps"
          fi

      # 5️⃣ 原子切换
      - name: Atomic deploy
        run: |
          set -e

          CURRENT=${BASE}/current
          PREV=${BASE}/previous

          if [ -L "${CURRENT}" ]; then
            rm -f "${PREV}"
            mv "$(readlink ${CURRENT})" "${PREV}" || true
          fi

          ln -sfn "${NEW_RELEASE}" "${CURRENT}"

      # 6️⃣ 清理旧版本（保留 3 份）
      - name: Cleanup old releases
        run: |
          set -e
          cd "${BASE}/releases"
          ls -dt */ | tail -n +4 | xargs -r rm -rf
